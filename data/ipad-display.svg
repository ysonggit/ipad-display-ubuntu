<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8fe7"/>
      <stop offset="1" stop-color="#7a5ad8"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b26b"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#a3a9b0"/>
    </linearGradient>
  </defs>

  <!-- MacBook -->
  <g>
    <rect x="6" y="24" width="80" height="54" rx="5" fill="#000" opacity=".18"/>
    <rect x="6" y="22" width="80" height="54" rx="5" fill="#2a2d32"/>
    <rect x="10" y="26" width="72" height="46" rx="2" fill="url(#screen)"/>
    <path d="M0 78 H92 L87 86 H5 Z" fill="url(#base)"/>
    <rect x="38" y="78" width="16" height="2.5" rx="1" fill="#8b9198"/>
  </g>

  <!-- iPad, in front -->
  <g>
    <rect x="66" y="40.5" width="56" height="78" rx="8" fill="#000" opacity=".25"/>
    <rect x="66" y="38" width="56" height="78" rx="8" fill="#1c1e22"/>
    <rect x="70.5" y="42.5" width="47" height="69" rx="4" fill="url(#pad)"/>
  </g>

  <!-- a window sliding from the Mac onto the iPad -->
  <g>
    <rect x="52" y="55.5" width="38" height="28" rx="3" fill="#000" opacity=".2"/>
    <rect x="52" y="54" width="38" height="28" rx="3" fill="#ffffff"/>
    <rect x="52" y="54" width="38" height="7" rx="3" fill="#f1f3f5"/>
    <rect x="52" y="58" width="38" height="3" fill="#f1f3f5"/>
    <circle cx="57" cy="57.5" r="1.4" fill="#e5534b"/>
    <circle cx="61.5" cy="57.5" r="1.4" fill="#e6b13a"/>
    <circle cx="66" cy="57.5" r="1.4" fill="#57ab5a"/>
    <rect x="56" y="65" width="22" height="2.5" rx="1.2" fill="#c9ced4"/>
    <rect x="56" y="70" width="28" height="2.5" rx="1.2" fill="#c9ced4"/>
    <rect x="56" y="75" width="16" height="2.5" rx="1.2" fill="#c9ced4"/>
  </g>

  <!-- motion hint -->
  <path d="M28 49 h14 M24 55 h14 M30 61 h10" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round"/>
</svg>
